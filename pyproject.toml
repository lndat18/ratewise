[project]
name = "falcon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lndat", email = "datdev181104@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
falcon = "falcon.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["_old/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: cần PostgreSQL thật (DATABASE_URL)"]
